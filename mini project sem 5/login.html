<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Campus Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563EB,#06B6D4);
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#2563EB;
    font-size:30px;
}

.logo p{
    color:#666;
    margin-top:8px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:13px 45px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.input-box input:focus{
    border-color:#2563EB;
}

.left-icon{
    position:absolute;
    left:15px;
    top:15px;
    color:#2563EB;
}

.right-icon{
    position:absolute;
    right:15px;
    top:15px;
    cursor:pointer;
    color:#777;
}

.options{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:20px;
}

.options a{
    text-decoration:none;
    color:#2563EB;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#2563EB;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1D4ED8;
}

.register{
    margin-top:20px;
    text-align:center;
}

.register a{
    text-decoration:none;
    color:#2563EB;
    font-weight:bold;
}

.security{
    margin-top:20px;
    background:#F3F4F6;
    padding:12px;
    border-radius:8px;
    font-size:13px;
    color:#555;
    text-align:center;
}

@media(max-width:420px){

.login-box{
    width:90%;
}

}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<h1>Smart Campus</h1>
<p>Maintenance & Issue Reporting System</p>
</div>

<form action="main.html" method="POST">

<div class="input-box">

<i class="fa-solid fa-envelope left-icon"></i>

<input
type="email"
name="email"
placeholder="College Email"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock left-icon"></i>

<input
type="password"
id="password"
name="password"
placeholder="Password"
required
minlength="8">

<i class="fa-solid fa-eye right-icon" onclick="showPassword()" id="eye"></i>

</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
    <form action="main.html" method="get"></form>
<i class="fa-solid fa-right-to-bracket"></i>
 Login
</button>

<div class="register">

Don't have an account?

<a href="#">
Register
</a>

</div>

<div class="security">

🔒 Secure Login • Password Protected • Session Authentication

</div>

</form>

</div>



<script src="login.js"></script>

</body>
</html>
